<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Accessibility PR review scoreboard</title>
  <desc id="desc">Seven scored accessibility pull requests. MUI 9 of 12, VS Code 8 of 12, one Bootstrap PR at 7 of 12, two Bootstrap PRs at 6 of 12, and a stalled Bootstrap PR and Storybook at 4 of 12. Finding: no case reaches the mature-process band, and the most heavily reviewed PR scored lowest.</desc>
  <defs>
    <style>
      .bg { fill: #EEF1F4; }
      .card { fill: #FFFFFF; stroke: #CBD2D9; stroke-width: 1; }
      .ink { fill: #141B2E; font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; }
      .soft { fill: #4C5768; font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif; }
      .mono { fill: #5F6B7C; font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; }
      .teal { fill: #2F6F6B; }
      .tealbg { fill: #E4EEED; }
      .amber { fill: #A8752F; }
      .amberbg { fill: #F4E9DA; }
      .line { stroke: #DEE3E8; stroke-width: 1; }
      .bar-hi { fill: #2F6F6B; }
      .bar-mid { fill: #6B8F8C; }
      .bar-lo { fill: #A8752F; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <rect class="card" x="48" y="40" width="1104" height="595" rx="8"/>

  <text class="mono teal" x="80" y="88" font-size="16" letter-spacing="1.5">OSS ACCESSIBILITY INCLUSION</text>
  <text class="ink" x="80" y="138" font-size="36" font-weight="600">How seven a11y PRs actually scored</text>
  <text class="soft" x="80" y="172" font-size="18">Code review is not accessibility verification. AT evidence predicts quality.</text>

  <!-- column headers -->
  <text class="mono" x="80" y="230" font-size="13">CASE STUDY</text>
  <text class="mono" x="520" y="230" font-size="13">CATEGORY</text>
  <text class="mono" x="820" y="230" font-size="13">SCORE / 12</text>
  <line class="line" x1="80" y1="244" x2="1112" y2="244"/>

  <!-- rows -->
  <text class="ink" x="80" y="282" font-size="20" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">MUI #48572</text>
  <text class="soft" x="520" y="282" font-size="16">AT-specific behavior</text>
  <rect class="bar-hi" x="820" y="266" width="180" height="18" rx="3"/>
  <text fill="#EEF1F4" x="900" y="280" font-size="14" font-family="IBM Plex Mono, Menlo, monospace" text-anchor="middle">9</text>

  <text class="ink" x="80" y="326" font-size="20" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">VS Code #324192</text>
  <text class="soft" x="520" y="326" font-size="16">Contrast / theming</text>
  <rect class="bar-hi" x="820" y="310" width="160" height="18" rx="3"/>
  <text fill="#EEF1F4" x="890" y="324" font-size="14" font-family="IBM Plex Mono, Menlo, monospace" text-anchor="middle">8</text>

  <text class="ink" x="80" y="370" font-size="20" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">Bootstrap #42524</text>
  <text class="soft" x="520" y="370" font-size="16">Defects after unreviewed merge</text>
  <rect class="bar-mid" x="820" y="354" width="140" height="18" rx="3"/>
  <text fill="#EEF1F4" x="880" y="368" font-size="14" font-family="IBM Plex Mono, Menlo, monospace" text-anchor="middle">7</text>

  <text class="ink" x="80" y="414" font-size="20" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">Bootstrap #42539</text>
  <text class="soft" x="520" y="414" font-size="16">Semantics / reading order</text>
  <rect class="bar-mid" x="820" y="398" width="120" height="18" rx="3"/>
  <text fill="#EEF1F4" x="870" y="412" font-size="14" font-family="IBM Plex Mono, Menlo, monospace" text-anchor="middle">6</text>

  <text class="ink" x="80" y="458" font-size="20" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">Bootstrap #42500</text>
  <text class="soft" x="520" y="458" font-size="16">Complex widget interaction</text>
  <rect class="bar-mid" x="820" y="442" width="120" height="18" rx="3"/>
  <text fill="#EEF1F4" x="870" y="456" font-size="14" font-family="IBM Plex Mono, Menlo, monospace" text-anchor="middle">6</text>

  <text class="ink" x="80" y="502" font-size="20" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">Bootstrap #41607</text>
  <text class="soft" x="520" y="502" font-size="16">Stalled 11 months</text>
  <rect class="bar-lo" x="820" y="486" width="80" height="18" rx="3"/>
  <text fill="#EEF1F4" x="850" y="500" font-size="14" font-family="IBM Plex Mono, Menlo, monospace" text-anchor="middle">4</text>

  <rect class="amberbg" x="72" y="522" width="1040" height="52" rx="6"/>
  <text class="ink" x="88" y="554" font-size="20" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">Storybook #35321</text>
  <text class="amber" x="520" y="554" font-size="16" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">Most reviewed · lowest score</text>
  <rect class="bar-lo" x="820" y="538" width="80" height="18" rx="3"/>
  <text fill="#EEF1F4" x="850" y="552" font-size="14" font-family="IBM Plex Mono, Menlo, monospace" text-anchor="middle">4</text>

  <text class="mono" x="80" y="616" font-size="13">Sanjay C. · ecogetaway/oss-accessibility-inclusion · rubric 0–12 · re-verified 29 Jul 2026</text>
</svg>
